[project]
name = "bioart-browser"
version = "0.4.0"
description = "Local, source-aware BioArt discovery and figure workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pillow>=11,<13",
    "lxml>=5,<7",
    "resvg-py>=0.2,<1",
    "httpx>=0.28,<1",
    "mcp>=1.12,<2",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioart"]

[project.scripts]
bioart = "bioart.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
